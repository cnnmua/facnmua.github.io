<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechVision - 驱动未来 · 智联世界</title>
  <meta name="description" content="专注于智能产品与数字化解决方案的企业官网">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="header" id="header"></header>

  <!-- Hero 轮播 -->
  <section class="hero" id="hero"></section>

  <!-- 特性 -->
  <section class="section">
    <div class="container">
      <h2 class="section-title" data-i18n="why_choose">为什么选择 <span class="text-gradient">TechVision</span></h2>
      <p class="section-subtitle" data-i18n="why_choose_sub">六大核心优势，为您的数字化转型保驾护航</p>
      <div class="features-grid" id="featuresGrid"></div>
    </div>
  </section>

  <!-- 统计数据 -->
  <section class="stats-bar">
    <div class="container">
      <div class="stats-grid" id="statsGrid"></div>
    </div>
  </section>

  <!-- 推荐产品 -->
  <section class="section" style="background:var(--bg-white);">
    <div class="container">
      <h2 class="section-title" data-i18n="core_products">核心产品</h2>
      <p class="section-subtitle" data-i18n="core_products_sub">覆盖物联网、大数据、智能安防等多领域解决方案</p>
      <div class="product-grid" id="homeProducts"></div>
      <div style="text-align:center;margin-top:40px;">
        <a href="product.html" class="btn btn-outline" data-i18n="view_all_products">查看全部产品</a>
      </div>
    </div>
  </section>

  <!-- CTA -->
  <section class="cta-section">
    <div class="container">
      <div class="cta-box">
        <h2 data-i18n="cta_title">开启您的数字化转型之旅</h2>
        <p data-i18n="cta_sub">无论您处于哪个行业，我们都能为您提供量身定制的技术方案</p>
        <a href="contact.html" class="btn btn-lg" data-i18n="contact_now">立即咨询</a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer" id="footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
