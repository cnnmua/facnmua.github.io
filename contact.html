<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系我们 - TechVision</title>
  <meta name="description" content="联系 TechVision，获取专业的技术咨询与解决方案">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="header" id="header"></header>

  <!-- 页面 Banner -->
  <section class="page-banner">
    <div class="container">
      <h1 data-i18n="contact_title">联系我们</h1>
      <p data-i18n="contact_sub">无论您有任何技术问题或合作意向，我们都期待您的来信</p>
    </div>
  </section>

  <!-- 联系内容 -->
  <section class="section">
    <div class="container">
      <div class="contact-wrap">
        <!-- 联系信息 -->
        <div class="contact-info-card" id="contactInfo"></div>

        <!-- 留言表单 -->
        <div class="contact-form">
          <h3 data-i18n="online_message">在线留言</h3>
          <form id="contactForm">
            <div class="form-group">
              <label data-i18n="form_name">姓名 <span class="req">*</span></label>
              <input type="text" class="form-control" name="name" data-i18n-ph="form_name_ph" placeholder="请输入您的姓名" required>
            </div>
            <div class="form-group">
              <label data-i18n="form_email">邮箱</label>
              <input type="email" class="form-control" name="email" data-i18n-ph="form_email_ph" placeholder="请输入您的电子邮箱">
            </div>
            <div class="form-group">
              <label data-i18n="form_phone">电话</label>
              <input type="tel" class="form-control" name="phone" data-i18n-ph="form_phone_ph" placeholder="请输入您的联系电话">
            </div>
            <div class="form-group">
              <label data-i18n="form_subject">主题</label>
              <input type="text" class="form-control" name="subject" data-i18n-ph="form_subject_ph" placeholder="请输入咨询主题">
            </div>
            <div class="form-group">
              <label data-i18n="form_message">留言内容 <span class="req">*</span></label>
              <textarea class="form-control" name="message" data-i18n-ph="form_message_ph" placeholder="请输入您的留言或咨询内容" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="width:100%;" data-i18n="submit_message">提交留言</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer" id="footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
