<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - TechVision</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- 登录页面 -->
  <div id="loginPage" class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <span class="logo-icon">TV</span>
        <span data-i18n="admin_login">TechVision 管理后台</span>
      </div>
      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label data-i18n="admin_username">用户名</label>
          <input type="text" class="form-control" name="username" data-i18n-ph="admin_username" placeholder="请输入用户名" required autocomplete="off">
        </div>
        <div class="form-group">
          <label data-i18n="admin_password">密码</label>
          <input type="password" class="form-control" name="password" data-i18n-ph="admin_password" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;" data-i18n="admin_login_btn">登录</button>
        <p class="login-hint" data-i18n="admin_login_hint">默认账号: admin / 密码: admin123</p>
      </form>
      <div style="text-align:center;margin-top:16px;">
        <button class="lang-toggle" id="langToggleLogin" onclick="toggleLangAdmin()"></button>
      </div>
    </div>
  </div>

  <!-- 后台主体 -->
  <div id="adminApp" class="admin-app" style="display:none;">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="logo-icon">TV</span>
        <span>TechVision</span>
      </div>
      <nav class="sidebar-nav">
        <a class="sidebar-item active" data-panel="dashboard">
          <span class="icon">📊</span> <span data-i18n="admin_dashboard">仪表盘</span>
        </a>
        <a class="sidebar-item" data-panel="products">
          <span class="icon">📦</span> <span data-i18n="admin_products">产品管理</span>
        </a>
        <a class="sidebar-item" data-panel="banners">
          <span class="icon">🖼️</span> <span data-i18n="admin_banners">轮播管理</span>
        </a>
        <a class="sidebar-item" data-panel="videos">
          <span class="icon">🎬</span> <span data-i18n="admin_videos">视频管理</span>
        </a>
        <a class="sidebar-item" data-panel="messages">
          <span class="icon">💬</span> <span data-i18n="admin_messages">留言管理</span>
        </a>
        <a class="sidebar-item" data-panel="settings">
          <span class="icon">⚙️</span> <span data-i18n="admin_settings">站点设置</span>
        </a>
        <a class="sidebar-item" data-panel="template">
          <span class="icon">🎨</span> <span data-i18n="admin_template">模板配置</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="../index.html" class="sidebar-item">🏠 <span data-i18n="admin_back_home">返回前台</span></a>
        <a class="sidebar-item" id="logoutBtn">🚪 <span data-i18n="admin_logout">退出登录</span></a>
      </div>
    </aside>

    <!-- 主区域 -->
    <main class="admin-main">
      <header class="admin-topbar">
        <h2 id="pageTitle" data-i18n="admin_dashboard">仪表盘</h2>
        <div class="admin-user">
          <button class="lang-toggle" id="langToggleAdmin" onclick="toggleLangAdmin()"></button>
          <span data-i18n="admin_admin">管理员</span>
        </div>
      </header>

      <div class="admin-content" id="adminContent">
        <!-- 内容由 admin.js 动态渲染 -->
      </div>
    </main>
  </div>

  <!-- 产品/轮播/视频 编辑弹窗 -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="editModalTitle">编辑</h2>
        <button class="modal-close" id="editModalClose">✕</button>
      </div>
      <div class="modal-body" id="editModalBody"></div>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script>
    // 后台页面也应用主题配色 + 语言初始化
    (function() {
      // 主题配色
      if (typeof DB !== 'undefined' && DB.getColorScheme) {
        var cs = DB.getColorScheme();
        var root = document.documentElement;
        root.style.setProperty('--primary', cs.primary);
        root.style.setProperty('--primary-dark', cs.primaryDark);
        root.style.setProperty('--primary-light', cs.primaryLight);
        root.style.setProperty('--primary-bg', cs.primaryBg);
        root.style.setProperty('--secondary', cs.secondary);
        root.style.setProperty('--accent', cs.accent);
      }
      // 语言初始化
      if (typeof detectLang === 'function') {
        document.documentElement.lang = detectLang() === 'zh' ? 'zh-CN' : 'en';
      }
    })();
  </script>
  <script src="admin.js"></script>
</body>
</html>
