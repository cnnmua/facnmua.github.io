<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>产品中心 - TechVision</title>
  <meta name="description" content="TechVision 核心产品与解决方案一览">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="header" id="header"></header>

  <!-- 页面 Banner -->
  <section class="page-banner">
    <div class="container">
      <h1 data-i18n="products_title">产品中心</h1>
      <p data-i18n="products_sub">覆盖物联网、大数据、智能安防、智慧社区等多领域的核心产品与解决方案</p>
    </div>
  </section>

  <!-- 产品列表 -->
  <section class="section">
    <div class="container">
      <div class="filter-bar" id="filterBar"></div>
      <div class="product-grid" id="productGrid"></div>
    </div>
  </section>

  <!-- CTA -->
  <section class="cta-section">
    <div class="container">
      <div class="cta-box">
        <h2 data-i18n="no_suitable">找不到合适的方案？</h2>
        <p data-i18n="no_suitable_sub">我们支持按需定制，联系我们的技术团队获取专属解决方案</p>
        <a href="contact.html" class="btn btn-lg" data-i18n="contact_custom">联系定制</a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer" id="footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
