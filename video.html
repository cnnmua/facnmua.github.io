<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频中心 - TechVision</title>
  <meta name="description" content="TechVision 产品演示、教程、案例分享与技术分享视频">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="header" id="header"></header>

  <!-- 页面 Banner -->
  <section class="page-banner">
    <div class="container">
      <h1 data-i18n="videos_title">视频中心</h1>
      <p data-i18n="videos_sub">产品演示、使用教程、客户案例与技术分享，带您全方位了解 TechVision</p>
    </div>
  </section>

  <!-- 视频列表 -->
  <section class="section">
    <div class="container">
      <div class="filter-bar" id="videoFilterBar"></div>
      <div class="video-grid" id="videoGrid"></div>
    </div>
  </section>

  <!-- CTA -->
  <section class="cta-section">
    <div class="container">
      <div class="cta-box">
        <h2 data-i18n="want_more">想了解更多？</h2>
        <p data-i18n="want_more_sub">浏览我们的产品中心，或直接联系获取专属演示</p>
        <a href="product.html" class="btn btn-lg" data-i18n="view_products">查看产品</a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer" id="footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
